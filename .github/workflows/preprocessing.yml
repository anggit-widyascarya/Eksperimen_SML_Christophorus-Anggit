name: Preprocessing Telco Churn

on:
  push:
    branches: [main]
    paths:
      - "telco_churn_raw/**"
      - "preprocessing/automate_Christophorus-Anggit.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated preprocessing
        working-directory: preprocessing
        run: |
          python automate_Christophorus-Anggit.py \
            --input ../telco_churn_raw/Telco-Customer-Churn.csv \
            --output telco_churn_preprocessing

      - name: Commit preprocessed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/telco_churn_preprocessing
          git diff --cached --quiet || git commit -m "Update preprocessed dataset [skip ci]"
          git push

      - name: Upload preprocessed dataset as artifact
        uses: actions/upload-artifact@v4
        with:
          name: telco_churn_preprocessing
          path: preprocessing/telco_churn_preprocessing
